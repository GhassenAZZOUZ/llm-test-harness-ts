# GitLab CI mirror of .github/workflows/llm-tests.yml
#
# Live job: set LLM_API_KEY as a *masked + protected* CI/CD variable scoped to the
# `llm-live` environment, then trigger with a pipeline schedule or `LIVE=true`.

default:
  image: node:20
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
  interruptible: true

variables:
  LLM_PROVIDER: mock # deterministic, free, no secrets
  CI: 'true'

stages: [lint, test, evals, package, live]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

lint:
  stage: lint
  script:
    - npm run lint
    - npm run typecheck
    - npm run validate

unit:
  stage: test
  parallel:
    matrix:
      - NODE_IMAGE: ['node:20', 'node:22']
  image: $NODE_IMAGE
  script:
    - npm run test:unit
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    reports:
      junit: reports/unit-junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml

gate-self-test:
  stage: test
  variables:
    LLM_MOCK_RESPONSES: test_data/mock/responses.yaml,test_data/mock/faulty.yaml
  script:
    - |
      if npx llm-harness run; then
        echo "Quality gate accepted a model with known regressions"; exit 1
      fi
    - echo "Gate correctly rejected the faulty model"

llm-evals:
  stage: evals
  needs: [unit]
  script:
    - npm run test:llm
    - npx llm-harness gate reports/results.json
  artifacts:
    when: always
    expire_in: 14 days
    paths: [reports/]
    reports:
      junit: reports/junit.xml
    expose_as: 'LLM evaluation report'

docker:
  stage: package
  needs: [lint]
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
  cache: []
  before_script: []
  script:
    - docker build -t llm-test-harness:$CI_COMMIT_SHORT_SHA .
    - docker run --rm llm-test-harness:$CI_COMMIT_SHORT_SHA

llm-evals-live:
  stage: live
  needs: [llm-evals]
  environment: llm-live
  rules:
    - if: '$LLM_API_KEY == null || $LLM_API_KEY == ""'
      when: never # skipped cleanly when no key is configured
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $LIVE == "true"
  variables:
    LLM_PROVIDER: openai
    LLM_MODEL: gpt-4o-mini
    LLM_SOFT_FAIL: 'true'
    LLM_GATE: 'true'
    LLM_WORKERS: '2'
  script:
    - npm run test:llm
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/]
    reports:
      junit: reports/junit.xml
