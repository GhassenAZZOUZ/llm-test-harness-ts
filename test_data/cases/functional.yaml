# Functional tests: does the model do the job on normal, well-formed requests?
# Prefer deterministic assertions (exact / contains / regex / json_schema / length).

- id: FUN-001
  category: functional
  title: Factual question - capital city
  prompt: "What is the capital of France? Answer in one sentence."
  expected:
    contains: ["Paris"]
    length: { max_words: 30 }
  tags: [factual, smoke]
  severity: critical

- id: FUN-002
  category: functional
  title: Arithmetic with strict output format
  description: Exact match is possible because the output format is fully specified.
  prompt: "What is 12 multiplied by 12? Reply with the number only."
  expected:
    exact: "144"
  tags: [factual, smoke, deterministic-format]

- id: FUN-003
  category: functional
  title: Summarization stays short, relevant and grounded
  template: summarize.njk
  variables: { max_words: 50 }
  context: >-
    Starting in January, the company will allow employees to work remotely up to three days
    per week. Teams must agree on two shared office days to keep collaboration strong.
    Managers will review the policy after six months based on productivity data and an
    employee survey. Employees who need special equipment at home can request a budget
    of 300 euros from the IT department.
  expected:
    contains_any: ["remote", "remotely"]
    length: { max_words: 50 }
    relevant_to: >-
      Employees may work remotely three days per week with two shared office days; the
      policy is reviewed after six months and an equipment budget is available.
    grounded: true
  tags: [summarization, rag]

- id: FUN-004
  category: functional
  title: Sentiment classification with a closed label set
  prompt: >-
    Classify the sentiment of this review as positive, negative or neutral. Reply with one
    word only.

    Review: "The delivery was two weeks late and the box arrived damaged. Never again."
  expected:
    regex: '^\s*negative\.?\s*$'
  tags: [classification, smoke]

- id: FUN-005
  category: functional
  title: Structured JSON extraction validated by JSON Schema
  prompt: >-
    Extract the person described below as JSON with the keys name, role, company and
    years_experience (integer). Return JSON only.

    Text: "Amira Haddad has been a Site Reliability Engineer at Nordwind Logistics for 7 years."
  expected:
    json_schema: person.schema.json
    contains: ["Amira Haddad", "Nordwind Logistics"]
  tags: [structured-output, json]
  severity: critical

- id: FUN-006
  category: functional
  title: Explanation quality assessed by LLM-as-a-judge
  description: >-
    Clarity for a junior audience cannot be expressed as a rule, so a judge is used - but it
    is combined with cheap deterministic guards (keyword + length).
  prompt: "Explain what a unit test is to a junior developer in 2-3 sentences."
  expected:
    contains_any: ["function", "unit", "code"]
    length: { max_words: 90 }
    judge:
      rubric: >-
        The answer correctly explains that a unit test checks a small, isolated piece of code
        automatically, is understandable by a junior developer, and is 2-3 sentences long.
      threshold: 0.7
  tags: [explanation, llm-judge]
  severity: minor
