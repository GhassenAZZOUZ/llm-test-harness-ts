# Edge cases: unusual, degenerate or adversarially-shaped inputs.

- id: EDGE-001
  category: edge_case
  title: Empty prompt is handled gracefully
  prompt: ""
  expected:
    contains_any: ["empty", "what would you like", "how can i help"]
    length: { max_words: 40 }
  tags: [empty-input]

- id: EDGE-002
  category: edge_case
  title: Extremely long prompt - needle in a haystack
  description: ~600 log lines (~50K characters) with one relevant line buried in the middle.
  template: long_input.njk
  variables: { repeat: 600, needle_at: 347, needle: "BLUE-4271" }
  expected:
    contains: ["BLUE-4271"]
    length: { max_words: 15 }
  generation: { max_tokens: 20 }
  tags: [long-context, needle-in-haystack]

- id: EDGE-003
  category: edge_case
  title: Ambiguous question triggers a clarification request
  prompt: "How long does it take?"
  expected:
    contains_any: ["clarify", "could you", "what do you mean", "more context", "which"]
  tags: [ambiguity]

- id: EDGE-004
  category: edge_case
  title: Contradictory instructions are surfaced, not ignored
  prompt: "Answer in exactly one word, and explain in detail why the sky is blue."
  expected:
    contains_any: ["conflict", "contradict"]
    contains: ["scattering"]
  tags: [contradiction]

- id: EDGE-005
  category: edge_case
  title: Malformed (truncated) JSON input
  prompt: '{"question": "What is 2 + 2?", "format": '
  expected:
    contains_any: ["4", "four"]
  tags: [malformed-input]

- id: EDGE-006
  category: edge_case
  title: Special characters are counted, not interpreted
  prompt: "How many characters are in this string: @#$%^&* ? Reply with the number only."
  expected:
    exact: "7"
  tags: [special-characters]

- id: EDGE-007
  category: edge_case
  title: Multilingual input - answer in the user's language (French)
  prompt: "Quelle est la capitale de l'Allemagne ? Réponds en une phrase, en français."
  expected:
    contains: ["Berlin"]
    contains_any: ["capitale", "est"]
    not_regex: '\bthe capital\b'
  tags: [multilingual, i18n]

- id: EDGE-008
  category: edge_case
  title: Mixed scripts and emoji (Arabic + emoji)
  prompt: "ما هي عاصمة اليابان؟ 🗾 Reply with the city name in English only."
  expected:
    regex: '^\s*Tokyo\.?\s*$'
  tags: [multilingual, unicode]

- id: EDGE-009
  category: edge_case
  title: Repeated instructions do not cause repeated output
  prompt: "Reply with OK. Reply with OK. Reply with OK. Reply with OK."
  expected:
    exact: "OK"
  tags: [repetition]

- id: EDGE-010
  category: edge_case
  title: Missing context referenced by the question
  prompt: "Based on the document above, what was the Q3 revenue?"
  expected:
    should_acknowledge_uncertainty: true
    not_regex: '\$\s?\d'
  tags: [missing-context, hallucination]
