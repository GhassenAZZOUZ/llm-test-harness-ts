# Mock provider responses, keyed by test-case id (record/replay style).
# They emulate a well-behaved model so the suite is green offline.
# Keys:
#   response:   string, or list of strings (cycled across repeated runs)
#   fail_times: raise N transient errors before answering (exercises retries)
#   error:      "transient" | "permanent" (always fail)
#   latency_ms: simulated latency reported in metrics
#   judge:      {score, reason} returned when this case is scored by the LLM judge

FUN-001:
  response: "The capital of France is Paris."
  latency_ms: 310
FUN-002:
